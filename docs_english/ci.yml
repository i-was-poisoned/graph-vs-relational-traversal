########################################################################
# ANNOTATED COPY — for learning only.
#
# This is a line-by-line explained duplicate of .github/workflows/ci.yml.
# GitHub does NOT run it: GitHub only reads the files inside
# .github/workflows/. This one lives in docs_english/ because its purpose
# is to teach. The real file (with fewer comments) is .github/workflows/ci.yml.
#
# The only thing that differs from the original is the comment lines
# (the ones starting with #). All other lines are identical.
########################################################################

# ---------------------------------------------------------------------
# YAML in four rules (this file's format)
#
# 1. `key: value` — a piece of data with its name, as in a Python
#    dictionary: `name: CI` means "the name is CI".
# 2. INDENTATION (the spaces on the left) says what goes inside what,
#    as in Python. Always with SPACES, never tabs. One space too many or
#    too few changes the meaning, or breaks the file.
# 3. A dash `- ` at the start of a line is an item in a LIST
#    (used by the steps, `steps`, further down).
# 4. `#` starts a comment, just like in Python: GitHub ignores it.
# ---------------------------------------------------------------------

# Continuous integration: run the unit tests in tests/ on GitHub's machines.
# Results appear in the repository's "Actions" tab (one run per trigger).

# name: the workflow's name. It's the one shown in the left-hand column
# of the Actions tab, and on the README badge.
name: CI

# ---------------------------------------------------------------------
# on: THE TRIGGERS. When this workflow runs.
# They're the ones in the table in "What triggers a CI: not just git push".
# Each key with nothing after it (`push:`) means "this trigger, with its
# default options".
#
# `schedule` isn't here: the daily check of GH Archive's format is step 4
# of the plan, and it will be another workflow.
# ---------------------------------------------------------------------
on:
  # push: every time you `git push`, on any branch.
  push:                # every git push, on any branch
  # pull_request: when someone proposes a change for review before it's
  # merged into main. A personal project hardly uses it, but it's normal
  # to have it: that way the tests run BEFORE anything is accepted.
  pull_request:        # every proposed change, before it's merged
  # workflow_dispatch: adds a "Run workflow" button to the Actions tab,
  # to start it by hand without any push.
  workflow_dispatch:   # a "Run workflow" button in the Actions tab

# ---------------------------------------------------------------------
# permissions: what this workflow may do with your repository.
# GitHub gives each run a temporary "key". Here we say that key can only
# READ the code (contents: read): it can't modify anything, publish, or
# open issues. This is the "least privilege" principle: if something
# went wrong, the possible damage is minimal.
# ---------------------------------------------------------------------
# The tests only need to read the code.
permissions:
  contents: read

# ---------------------------------------------------------------------
# jobs: this workflow's JOBS. A workflow can have several (for example,
# later on, one for unit tests and another for integration), and each
# one runs on its OWN machine.
# ---------------------------------------------------------------------
jobs:
  # unit-tests: the name we give this job (we choose it). It shows up on
  # GitHub when you open a run.
  unit-tests:
    # runs-on: what kind of machine it runs on. `ubuntu-24.04` is a
    # Linux (Ubuntu 24.04) virtual machine, NEW and EMPTY on every run,
    # which GitHub destroys at the end: it's the "runner".
    # Why Linux, if you use Windows? Because it's the fastest and most
    # common option, and the tests don't depend on the operating system.
    # (`windows-latest` exists too.)
    #
    # Why 24.04 and not `ubuntu-latest`? The first version of this file
    # used `ubuntu-latest`, and the first run FAILED at the "Set up
    # Python" step: "The version '3.14.0' ... was not found for Ubuntu
    # 26.04". `ubuntu-latest` means "the latest version", and in October
    # 2026 GitHub switched it from 24.04 to 26.04, for which there's no
    # Python 3.14.0 build. In other words: "latest" changed underneath,
    # without anyone touching the code. By pinning the version (`24.04`),
    # just as we pin packages with `==`, that can no longer happen.
    # A fixed version, not ubuntu-latest: Python 3.14.0 isn't built for Ubuntu 26.04.
    runs-on: ubuntu-24.04
    # timeout-minutes: if the job takes longer than 10 minutes, GitHub
    # stops it. The tests take seconds, so taking 10 minutes can only
    # mean something got stuck. Without this, the default limit is
    # 6 hours.
    # The unit tests take seconds; anything this long means something is stuck.
    timeout-minutes: 10

    # -----------------------------------------------------------------
    # steps: the STEPS, in order. It's a list (that's why each one
    # starts with `-`). If a step fails, the following ones don't run
    # and the whole run turns red.
    #
    # There are two kinds of step:
    #   uses: ...  -> uses an ACTION: a ready-made piece published on
    #                 GitHub by others (like importing a package).
    #   run: ...   -> runs a COMMAND in the machine's terminal, as if
    #                 you typed it yourself in Git Bash.
    # `name:` is just the label you'll see on GitHub for each step.
    # -----------------------------------------------------------------
    steps:
      # Step 1. The machine starts EMPTY: it doesn't even have your code.
      # The official `actions/checkout` action does the equivalent of a
      # `git clone` of the repository, at the exact version of the push.
      #
      # `@v5` is the action's VERSION, pinned: the same idea as the `==`
      # in requirements.txt. If the authors publish a v6 with changes,
      # this file will keep using v5.
      # Each run starts on an empty machine: first, get a copy of the repository.
      - name: Check out the code
        uses: actions/checkout@v5

      # Step 2. Install Python. The official `actions/setup-python` action
      # downloads and installs the version we ask for in `with:` (`with`
      # holds the options an action receives, like a function's
      # arguments).
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # In quotes so YAML reads it as TEXT. Without quotes, a version
          # like 3.10 would be read as the NUMBER 3.1 (the trailing zero
          # disappears). Here "3.14.0", the same as on your computer.
          python-version: "3.14.0"   # same version as the project (README)

      # Step 3. Install the packages. It's the same command as on your
      # computer. Here you can see what was explained under
      # "Dependencies": in CI EVERYTHING is downloaded from PyPI on EVERY
      # run, because the machine is new.
      # No .venv is needed: the machine is already an isolated environment
      # that exists only for this run.
      # requirements-dev.txt also installs requirements.txt (its "-r" line).
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # Step 4. Run the tests. `-v` so that GitHub shows each test's name
      # with its PASSED or FAILED.
      # If any test fails, pytest exits with a code other than 0, and
      # GitHub marks the step (and the run) red.
      # No `run.sh` or secrets.sh: these tests use no passwords.
      # No databases or passwords needed: the unit tests use tiny made-up files.
      - name: Run the unit tests
        run: python -m pytest -v

  # ---------------------------------------------------------------------
  # integration-tests: a SECOND job. Jobs in the same workflow run AT THE
  # SAME TIME (in parallel), each on its OWN new machine — so this one
  # repeats checkout, Python and pip install; it shares nothing with
  # unit-tests. The run only turns green if BOTH jobs succeed.
  # ---------------------------------------------------------------------
  integration-tests:
    runs-on: ubuntu-24.04
    # A bit more room than the unit tests: the database containers have to
    # be downloaded and started first.
    timeout-minutes: 15

    # -------------------------------------------------------------------
    # services: SERVICE CONTAINERS. Docker containers that GitHub starts
    # BEFORE the steps and destroys at the end of the job. Each one is
    # created from an IMAGE on Docker Hub (see "Images and containers
    # (Docker)" in the notes).
    #
    # Images are PINNED to an exact version, like packages with `==` and
    # the runner with ubuntu-24.04: the same PostgreSQL 18.6 and Neo4j
    # 2026.10.0 as on your computer. (We've seen what `latest` can do.)
    # -------------------------------------------------------------------
    # Temporary database servers, started before the steps and destroyed at the end.
    # Same versions as the project. Authentication is off: they only exist inside
    # this run's machine, so no password is needed anywhere.
    services:
      # The name of the service (our choice).
      postgres:
        image: postgres:18.6
        # env: environment variables passed INTO the container, which the
        # image reads when it starts.
        env:
          # trust = accept connections without asking for a password. Fine
          # here: the container lives only inside this temporary machine,
          # nobody else can reach it, and it's destroyed at the end. That's
          # why ci.yml contains no password at all.
          POSTGRES_HOST_AUTH_METHOD: trust
        # ports: "machine port:container port". The container's 5432 is
        # made available as localhost:5432 on the runner — exactly where
        # load_postgres.py looks, so the loader runs unchanged.
        ports:
          - 5432:5432
        # options: extra options for `docker run`. Here a HEALTH CHECK:
        # every 5 s, run `pg_isready` inside the container; it's "healthy"
        # once PostgreSQL accepts connections (up to 10 tries). GitHub
        # waits for healthy services before starting the steps.
        # `>-` is YAML for "the following indented lines are ONE string,
        # joined with spaces" (the `-` drops the final newline): a long
        # command written over several lines for readability.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      neo4j:
        # Community = the free edition (Enterprise needs a licence). It
        # allows only one user database, "neo4j" — see the env below.
        image: neo4j:2026.10.0-community
        env:
          # none = authentication switched off, for the same reason as
          # PostgreSQL's trust. Neo4j has no health check here: the test
          # itself waits for it (wait_for_neo4j, up to 90 s).
          NEO4J_AUTH: none
        # Bolt, the port the Python driver uses: localhost:7687, as in
        # load_neo4j.py.
        ports:
          - 7687:7687

    # -------------------------------------------------------------------
    # env at JOB level: environment variables for EVERY step of this job
    # (and the programs they start, like pytest).
    # -------------------------------------------------------------------
    env:
      # load_neo4j.py reads os.environ["NEO4J_PASSWORD"] and would stop
      # with an error if it were missing. With authentication off the
      # server ignores it, so any text will do — and it's clearly not a
      # real password.
      # The loaders read this variable; with authentication off its value is ignored.
      NEO4J_PASSWORD: unused-authentication-is-off
      # test_integration.py uses "gharchivetest" by default, which would
      # need CREATE DATABASE (Enterprise only). Here: the built-in "neo4j".
      # Neo4j Community allows only one user database, "neo4j".
      TEST_NEO4J_DATABASE: neo4j

    # The same first three steps as unit-tests (new machine, so they're
    # needed again), then the integration tests instead of the unit tests.
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.0"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # `-m integration` replaces pytest.ini's `-m "not integration"`
      # (when there are two -m, the last one wins): ONLY the 6 integration
      # tests run, against the two service containers above.
      - name: Run the integration tests
        run: python -m pytest -v -m integration
