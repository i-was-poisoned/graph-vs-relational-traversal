# pytest settings, read automatically when you run "python -m pytest"
# from the project folder.
[pytest]
# Where the tests are.
testpaths = tests
# The scripts import each other by name (e.g. "import extract_csv"), so the
# tests need the scripts folder on Python's search path too.
pythonpath = scripts
# Tests that need running databases are marked "integration" and skipped by
# default; run them with:  python -m pytest -m integration
markers =
    integration: needs running PostgreSQL and Neo4j servers
addopts = -m "not integration"
